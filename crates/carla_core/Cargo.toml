[package]
license = "MIT"
name = "carla_core"
version = "0.1.0"
edition = "2021"
description = "Moteur Rust de Carla Wiring : scan des plugins, fichiers, lancement de Carla"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "2", default-features = false, features = ["tls", "native-certs", "json"] }
