[package]
license = "MIT"
name = "carla-wiring"
version = "0.1.0"
description = "Carla Wiring : automatisation du câblage (patchbay) de Carla"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
carla_core = { path = "../crates/carla_core" }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
